[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; MotorControl declares the Adafruit PCA9685 driver as a dependency, which
; pulls in Adafruit BusIO. That library needs the framework's Wire/SPI even
; for sketches (like this one) that only use StepMotor, and the default
; library dependency finder does not resolve them for a nested dependency.
lib_ldf_mode = deep+
monitor_filters = send_on_enter

lib_deps =
    symlink://../MotorControl
; No send_on_enter / monitor_echo: the sketch does its own line editing and
; echo (see readSerial). send_on_enter buffers keystrokes without handling
; backspace, so the delete byte would be shipped to the sketch inside the
; command, and monitor_echo would double every echoed character.