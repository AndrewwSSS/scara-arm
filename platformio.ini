[platformio]
default_envs = uno
; Optional, not committed: overrides [deps] to build against local checkouts.
extra_configs = platformio.local*.ini

[deps]
lib_deps =
    https://github.com/AndrewwSSS/MotorControl.git#v0.3.0
    https://github.com/AndrewwSSS/CommandDispatcher.git#v0.1.0

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; TRACE, so the console's per-axis debug toggle shows commands and steps.
build_flags = -D MC_LOG_LEVEL=MC_LOG_TRACE

lib_ldf_mode = deep+
monitor_filters = send_on_enter
lib_deps = ${deps.lib_deps}

; ESP32 DevKit, Arduino core 2.0.17.
[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags = -D MC_LOG_LEVEL=MC_LOG_TRACE

lib_ldf_mode = deep+
monitor_filters = send_on_enter
lib_deps = ${deps.lib_deps}

; Host-side unit tests: pio test -e native
; Builds against test/fake/ instead of a real core; main.cpp is not built.
[env:native]
platform = native
test_framework = unity
test_filter = test_*
build_flags =
    -std=gnu++17
    -I src
    -I test/fake
