[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; MotorControl logging: TRACE so the jog console's per-axis debug toggle
; shows commands and steps. See ../MotorControl/src/Log.h.
build_flags = -D MC_LOG_LEVEL=MC_LOG_TRACE

lib_ldf_mode = deep+
monitor_filters = send_on_enter

lib_deps =
    symlink://../../MotorControl
    symlink://../../CommandDispatcher