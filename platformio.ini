[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; MotorControl logging: TRACE so the jog console's per-axis debug toggle
; shows commands and steps. See ../MotorControl/src/Log.h.
build_flags = -D MC_LOG_LEVEL=MC_LOG_TRACE

lib_ldf_mode = deep+
monitor_filters = send_on_enter

lib_deps =
    symlink://../MotorControl
    symlink://../CommandDispatcher

; The same sketch on an ESP32 DevKit. Core 2.0.17 (platform 7.0.1); see the
; ESP32 migration plan, Phase 3.
[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags = -D MC_LOG_LEVEL=MC_LOG_TRACE

lib_ldf_mode = deep+
monitor_filters = send_on_enter

lib_deps =
    symlink://../MotorControl
    symlink://../CommandDispatcher

; Host-side unit tests for src/SettingsStore.h and src/Driver.h: pio test -e native
; It compiles against test/fake/ (Arduino.h, EEPROM.h) instead of a real core;
; main.cpp is not built for these.
[env:native]
platform = native
test_framework = unity
test_filter = test_*
build_flags =
    -std=gnu++17
    -I src
    -I test/fake
